# 표류자 — 시리즈 바이블 (제작판 v1, 2026-10-28)
# 신규 픽션 채널 전용. 기존 역사공학 채널(완전 사실 기반)과 섞지 않는다.
# 원본: 신규 채널 리서치 결론(critic) → EP.1 제작 준비 과정에서 확정·수정한 항목은 'changed' 주석.

series:
  working_title: 표류자            # 상표 검색 후 확정. 쇼츠 제목 접두 「표류자 EP.n」 고정
  tagline: "1653년, 돌아갈 방법은 기록뿐이다."
  language: ko                    # 롱폼은 en 자막 + en 오디오 트랙
  audience_setting: not_made_for_kids   # 채널·영상 모두
  channel_description_fixed: >-
    AI로 구현한 창작 픽션 시리즈입니다. 실제 지명과 역사 기록이 배경으로 등장하지만
    주인공·사건은 허구입니다. 모든 회차는 직접 기획·대본·편집합니다.
  upload: 화·목·토 21:30 KST, 틱톡·릴스 동시 게시

production:                       # changed: 하이브리드(skia 리그) 기본안 → Grok 풀 AI로 확정(운영자 결정 2026-10-28)
  video_engine: grok-imagine-video-1.5     # 9:16, 720p(레퍼런스 사용 시 상한), 오디오 생성 끔
  image_engine: grok-imagine-image-2.0     # 레퍼런스·시작 프레임 편집
  chaining: 모든 샷은 앞 샷의 실제 사용 끝 프레임에서 출발 (C 이어가기 / A 앵글 컷 / T 시간 점프 / K 키프레임 / F 정지)
  identity_lock: 매 영상 요청에 캐릭터 레퍼런스 동봉 + 정체성 문장 자동 첨부, C 링크 최대 3연속
  overlays: 기존 skia 렌더러(도면·인벤토리·지도·경고·자막) — 영상 생성물에 글자를 넣지 않는다
  tts: 줄 단위 생성(build/tts/Nxx.wav) → render 재실행으로 장면표 타이밍 자동 갱신
  evidence: build/evidence/jobs.jsonl(요청·응답·입력 해시), 확정 레퍼런스, 스케치 원본, 대본 이력

world_rules:                      # EP.0에서 카드 3장으로 공개, 매 시즌 재공개
  R1: 그 시대에 존재한 재료·도구만 쓴다 (시대착오 금지 목록 유지 — 고구마 1763 조선 전래 등)
  R2: 큰 역사는 바뀌지 않는다(시간 탄성). 주인공 행동은 개인 생존 규모에만 영향
  R3: 기술 1개를 기록할 때마다 '돌아가는 길'의 단서가 1개 쌓인다 (시즌 미스터리 축)
  R4: 전투·사상자는 화면 밖. 사람을 향한 무기 사용 0, 시체 0, 유혈 0
  R5: 실존 인물(하멜, 이원진 제주목사, 효종 등)은 실루엣·배경 언급만. 대사·얼굴 0
  R6: 동물은 위기 소재가 아니다. 고양이 위기 회차 30화당 ≤3, 고통 클로즈업 0, '울리는' BGM 0

protagonist:
  name: 없음                      # 시청자 별명 유도(고정 댓글로 공모)
  design_sheet: characters/model_sheet.svg
  head: 무광 비유약 자기 질감의 달걀형(위가 약간 넓음), 이목구비·귀 없음, #D8D5CF
  proportion: 머리 = 전체 키의 약 1/6 (6등신)    # changed: 성인 체형 신호(MFK 회피). 1/4(4등신) 이하는 유아·SD 비율이라 쓰지 않는다
  hands_feet: 머리와 같은 재질, 손가락 5개, 맨발(EP.4 짚신 전까지)
  outfit_s1_early: 남색 윈드브레이커 #2B3A4A(소매 걷음) + 주황 폼 구명조끼 #F08A24(검은 버클 3, 어깨 반사띠) + 숯회색 바지 #4A4D50(종아리까지 걷음)
  props_on_body: 쇠 호루라기(왼쪽 어깨끈, 짧은 검은 끈)
  acting: 성인 다큐 톤의 절제된 동작. 과장·카툰 연기 금지. '본다'는 고개 방향으로만
  forbidden: 큰 눈, 볼터치, 표정, 파스텔, 원색 카툰, 검은 동그란 머리(문명), 로고·글자
  voice: 없음 — 3인칭 내레이터(성인 다큐 톤, 정밀 숫자 1~2개/회)

companion:
  species: 고양이 (네덜란드 상선 스페르베르호의 배 고양이라는 설정, 허구)
  name: 감                        # 제작 ID. 화면 내레이션에서는 '고양이'
  design: 마른 성체 단모 주황 태비 #E8762B, 흰 가슴, 흰 앞발 2개(뒷발 주황), 호박색 눈, 왼쪽 귀 끝 V자 홈, 고리 무늬 꼬리(끝 진함)
  collar: 가는 갈색 가죽 끈 + 무광 놋쇠 원판 1개 — EP.1~4 판독 불가, EP.5에서 글자 노출(떡밥 F2)
  role: 탐색 트리거(물·먹이·위험 감지), 감정 슬롯, 떡밥 운반자. 말하지 않음, 의인화 금지, 실제 고양이 행동만
  state_fields: [건강, 위치(동행/대기), 신뢰도]

ledger_file: bible/ledger.json     # 회차 종료 상태 원장(연속성 린트 기준)

route_table:                      # 하멜 기록 기반. ※ = 고증 확인 필요
  S1_제주: 대정 해안 → 대정현 관아 → 제주목 (1653-08 ~ 1654-05) ※ 표착 지점·날짜는 기록 간 이견
  S2_육로: 해남 → 영암 → 나주 → 장성 → 정읍 → 전주 → 공주 → 한양 (1654-05~06) ※ 경유지 확인 필요
  S3: 한양 (1654~1656)
  S4: 강진 전라병영 (1656~1663)
  S5: 여수 (1663~1666)
  rule: 시즌 안에서 루트는 연속, 시대 교체는 시즌 단위만

season1_episodes:                 # 결말 분포 성공 5 / 부분 4 / 실패 1, 연속 동일 결말 금지 (changed 2026-10-28: 성공 6회는 10화 안에서 연속 없이 배치 불가 — EP.3·4·8 조정)
  - {ep: 0, title: "1653년 제주에 떨어진 첫 열흘 (표류자 EP.0)", form: 롱폼 8~10분, publish: W5}
  - {ep: 1, title: 바닷가의 민물, tech: 대나무 물통, principle: 민물-바닷물 밀도 차·해안 용천수, outcome: 성공}
  - {ep: 2, title: 못 하나로 불, tech: 난파선 철못 + 차돌 + 쑥 부싯깃, principle: 철 미세 입자 산화 발열, outcome: 부분}
  - {ep: 3, title: 바닷물을 굽다, tech: 자염 소금, principle: 증발·농축, outcome: 성공}   # 대가 = 수율·연료 (COST)
  - {ep: 4, title: 서른 리를 걷는 신, tech: 짚신, principle: 꼬임 장력·마찰 분산, outcome: 부분}
  - {ep: 5, title: 비를 흘려보내는 옷, tech: 도롱이, principle: 겹침 배수, outcome: 성공, foreshadow: F2 목걸이 글자}
  - {ep: 6, title: 말이 통하지 않는 날, tech: 숯 필담 도구, principle: 탄소 안료, outcome: 부분}
  - {ep: 7, title: 바닥이 따뜻한 집, tech: 구들 보수, principle: 대류·축열, outcome: 성공}
  - {ep: 8, title: 생선 기름 등잔, tech: 어유 등잔, principle: 모세관 현상, outcome: 부분, foreshadow: F3 바다 쪽 불빛}
  - {ep: 9, title: 바다로 나갈 수 있을까, tech: 테우, principle: 부력·적재 한계, outcome: 실패}
  - {ep: 10, title: 북으로 가는 명령, tech: 봇짐·멜빵, principle: 하중 분산, outcome: 성공}

foreshadow_registry:
  items:
    - {id: F1, planted_ep: 2, due_ep: 10, content: 널빤지 각인 글자}
    - {id: F2, planted_ep: 5, due_ep: 10, content: 고양이 목걸이 글자}
    - {id: F3, planted_ep: 8, due_ep: S2-EP.0, content: 바다 쪽 불빛}
  rule: 심은 떡밥은 5~8회 안에 회수 또는 프리퀄 롱폼으로 이월. 미회수 3개 초과 금지

serial_slots:                     # 회차 대본 12슬롯(90~120초, 180초 상한)
  - STATE: "D+n · 연월 · 장소 자막 + 직전 회 1줄. 첫 2초 'AI 창작 시리즈 · 1653' 태그"
  - NEED: 오늘의 결핍 1개 + 구체적 위험(숫자 1개). 첫 문장 2.6초 안에 끝
  - HAVE: 원장 인벤토리만(연속성 린트)
  - GATHER: 실제 장소 고유 재료 + 고양이 역할 1컷
  - FAIL: 첫 시도 실패 = 재훅
  - PRINCIPLE: 원리 1개, 도면 순차 드로잉, 정밀 숫자 1~2개(출처 2개)
  - BUILD: 조립, 히어로 샷 배치
  - TEST: 작동 순간
  - COST: 대가·한계·현실 경고 오버레이(위험 기술 의무)
  - UNLOCK: 인벤토리 카드(누적 개수)
  - NEXT: 떡밥 또는 다음 지점 + 이상 징후 1개
  - TAG: 엔드카드, 음성 CTA 없음, 클리프행어

style:
  look: 포토리얼 실사풍 환경 + 자기 질감 캐릭터. 저채도, 흐린 날 기본, 시간대 변화로 리듬
  light_presets: [morning, late_morning, afternoon, dusk]   # shots.json light
  diagrams: 공학 도면 선화(흰 3px 선, 치수선), 배경 40% 어둡게, 레이어 0.7~1.2초 순차 드로잉
  music: 앰비언트 + 국악 타악 최소(획득 순간 1타). 동요풍·과장 효과음 금지
  on_screen_tags: 첫 2초 'AI 창작 시리즈 · 1653'(좌하단), 상시 'EP.n'(투명도 60%, 높이 3% 이하)
  loudness: -14 LUFS

forbidden_list:
  - 실존 인물 행동 묘사(실루엣·배경만)
  - 민간 상표·로고, 실존 기관 로고
  - 보디캠·CCTV·뉴스 자막바·블랙박스·인터뷰·파운드푸티지 포맷
  - 현재 날짜 타임스탬프
  - 최근 30년 참사 장소
  - 4·3 / 5·18 / 일제강점기 친일 소재(시즌 1~2), 진행 중 전쟁, 종교
  - 메타데이터·내레이션 금칙어: 아이, 어린이, 동화, 귀여운, kids, cute

rules_from_ep01_review:            # EP.1 페르소나 심사 B 규칙(review/ep01/persona_review.md 4절) — EP.2부터 적용
  counter: 획득 카드 카운터는 '기록 n'(= 원장 tech_unlocked 수). '보유 n' 쓰지 않음. 카드 = 이름 + 스탯 1칸 + 기록 n
  companion: 고양이는 원장 inventory가 아니라 companion으로 관리. HAVE 패널은 inventory.companion 칸(신뢰 ●○○○○, 개수 없음)
  diagram: 레이어 ≤8, 텍스트 ≤9, 숫자는 내레이션이 말한 것만 ≤1, 강조선 1개(#F08A24 7px), 콜아웃 라벨 ≤2, 최소 26px, 완성 상태 ≥2초
  principle_screen: 도면은 원리 설명 줄에만, 조건 줄은 실사. 도면 아래 샷 ≤8초, 캐릭터 상단 띠(y300~540), 실사 구도를 도면 좌표에 맞춘다
  narration: 회당 비유 ≥1, 귀에 남는 문장은 PRINCIPLE 마지막 줄, 조각 종결은 STATE·GATHER·UNLOCK만, 쉼표 틀은 FAIL·TEST만, NEXT는 대가를 취소하지 않음
  slots: 재료 인서트는 BUILD 첫 컷, HAVE 1줄(≤24음절), 답 뒤 꼬리 ≤20초
  habit: 완성품을 손끝으로 두 번 톡톡(매 회 UNLOCK 샷 첫 1초), 물때·위치 표시는 조약돌
  relation: 회마다 주인공이 고양이를 위해 하는 행동 1개(관계 비트)
  continuity: 회차 첫 샷은 이전 회 마지막 프레임에서 C 링크(base=EPn_END)로 바로 잇고, 시간 점프는 S02에서
  ui: 물때 ▲▼는 현재 상태 전용(같은 박스), 상태 자막은 2초부터, 엔드카드 '「표류자 EP.n」 · 기록 nn / ?' 상단(y300)
  ops: 공개 시각은 영상에 넣지 않고 고정 댓글이 맡음. 고정 댓글에 별명 공모 + 다음 회 + 고정 리듬

naming:
  shorts_title: 「표류자 EP.n」 + 2~8자 명사구 (40자 이내)
  longform_title: "[상황] + (연도) 앞, EP 번호 뒤. 예: '1653년 제주에 떨어진 첫 열흘 (표류자 EP.0)'"
  playlist: 시즌1 · 제주
