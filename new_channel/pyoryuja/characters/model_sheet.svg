  <!-- 표류자 디자인 기준 시트(벡터). 비율·색·식별 포인트의 기준이며 AI 레퍼런스 검수(QC) 기준선이다.
       사람이 이 위에 직접 손 스케치를 덧그려 characters/sketch/P_sketch.jpg 로 저장하면
       refs.json 의 P 작업이 그 스케치를 입력으로 쓴다(제작 증거 B-11). -->
  <defs>
    <style>
      text { font-family: Pretendard, 'Noto Sans KR', 'WenQuanYi Zen Hei', sans-serif; fill: #1d2125; }
      .t  { font-size: 30px; font-weight: 700; }
