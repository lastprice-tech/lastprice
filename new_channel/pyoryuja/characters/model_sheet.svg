  <g transform="translate(1180,830)">
    <text class="s" x="0" y="0">⑥ 왼쪽 귀 끝 V자 홈</text>
    <text class="s" x="0" y="24">⑦ 가는 가죽 끈 목걸이 + 무광 놋쇠 원판(판독 불가)</text>
    <text class="s" x="0" y="48">⑧ 흰 가슴</text>
    <text class="s" x="0" y="72">⑨ 흰 앞발 2개, 뒷발은 주황</text>
