  <g transform="translate(860,140)">
    <text class="n" x="0" y="0" style="font-weight:700">주인공 식별 포인트</text>
    <text class="s" x="0" y="34">① 무광 비유약 자기 질감, 위가 약간 넓은 달걀형 머리</text>
    <text class="s" x="22" y="56">이목구비·귀 없음 — 어떤 각도에서도</text>
    <text class="s" x="0" y="90">② 쇠 호루라기: 왼쪽 어깨끈, 짧은 검은 끈</text>
    <text class="s" x="0" y="124">③ 주황 폼 구명조끼, 검은 버클 3개, 어깨 반사띠</text>
    <text class="s" x="0" y="158">④ 남색 재킷, 소매는 팔뚝까지 걷음</text>
    <text class="s" x="22" y="180">손 = 머리와 같은 재질, 손가락 5개</text>
    <text class="s" x="0" y="214">⑤ 숯회색 바지 종아리까지 걷음, 맨발</text>
    <text class="s" x="22" y="236">(EP.4 짚신 전까지 맨발 유지)</text>
    <text class="s" x="0" y="270">로고·글자 없음 · 성인 체형 · 과장 연기 없음</text>
  </g>

